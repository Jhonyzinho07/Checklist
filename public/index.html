<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Checklist - Teto Mercury</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Metadados e Suporte a PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1f5c3f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Teto Mercury" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
</head>

<body>

  <header class="app-header">
    <div class="header-logo-wrap">
      <img src="images/logo.png" alt="Plasolution" class="logo" />
    </div>
    <div class="header-titulo">
      <h1>Checklist - Teto Mercury</h1>
      <p id="doc-info">Carregando informações...</p>
    </div>
    <div class="header-acoes">
      <span id="badge-rede" class="badge-rede online" title="Status de conexão">🟢 Online</span>
      <button id="btn-sync" class="btn-sync escondido" type="button"
        title="Checklists salvos localmente aguardando envio">🔄 Sincronizar (0)</button>
      <button id="btn-instalar" class="btn-instalar escondido" type="button">📲 Instalar App</button>
      <button id="btn-historico" class="btn-secundario" type="button">Histórico</button>
    </div>
  </header>

  <!-- Notificação Toast para PWA (Atualizações / Offline / Sincronização) -->
  <div id="pwa-toast" class="pwa-toast escondido">
    <span id="pwa-toast-mensagem"></span>
    <button id="pwa-toast-acao" class="btn-toast" type="button">OK</button>
  </div>

  <main id="app">

    <section class="cabecalho-form card">
      <h2>Identificação</h2>
      <div class="grid-campos" id="campos-cabecalho"></div>
    </section>

    <div id="secoes-container"></div>

    <div class="barra-progresso-wrap">
      <div class="barra-progresso">
        <div id="barra-progresso-fill" class="fill"></div>
      </div>
      <span id="progresso-texto">0 / 0 itens respondidos</span>
    </div>

  </main>

  <footer class="footer-fixo">
    <div id="mensagem-status" class="mensagem-status"></div>
    <button id="btn-gerar" class="btn-primario" type="button" disabled>Gerar PDF e Salvar</button>
  </footer>

  <!-- Modal de histórico -->
  <div id="modal-historico" class="modal escondido">
    <div class="modal-conteudo">
      <div class="modal-cabecalho">
        <h2>Checklists gerados</h2>
        <button id="fechar-historico" class="btn-secundario" type="button">Fechar</button>
      </div>
      <div id="lista-historico" class="lista-historico"></div>
    </div>
  </div>

  <!-- Modal de Zoom de Imagem (Lightbox) -->
  <div id="modal-zoom" class="modal-zoom escondido" role="dialog" aria-modal="true"
    aria-label="Visualizador de Imagem Ampliada">
    <div class="modal-zoom-header">
      <div class="modal-zoom-info">
        <div id="modal-zoom-legenda" class="modal-zoom-legenda">Referência Visual</div>
        <div id="modal-zoom-obs" class="modal-zoom-obs"></div>
      </div>
      <div class="modal-zoom-controles">
        <button id="zoom-in" class="btn-zoom" type="button" title="Aumentar Zoom (+)">🔍 +</button>
        <button id="zoom-out" class="btn-zoom" type="button" title="Diminuir Zoom (-)">🔍 −</button>
        <button id="zoom-reset" class="btn-zoom" type="button" title="Redefinir Tamanho">🔄 100%</button>
        <button id="fechar-zoom" class="btn-zoom btn-zoom-fechar" type="button" title="Fechar (Esc)">✕ Fechar</button>
      </div>
    </div>
    <div class="modal-zoom-viewport" id="modal-zoom-viewport">
      <img id="modal-zoom-img" src="" alt="Imagem ampliada" draggable="false" />
    </div>
    <div class="modal-zoom-rodape">
      <span>💡 Dica: Toque para dar zoom. Clique e arraste para explorar os detalhes da peça.</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
