<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checklist - Teto Mercury</title>
<link rel="stylesheet" href="style.css" />

<!-- Configurações do PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1f5c3f" />
<link rel="apple-touch-icon" href="/images/icon-192.png" />
</head>
<body>

<header class="app-header">
  <img src="images/logo.png" alt="Plasolution" class="logo" />
  <div class="header-titulo">
    <h1>Checklist - Teto Mercury</h1>
    <p id="doc-info">PSP_PROD_138 · Rev: 02</p>
  </div>
  <button id="btn-historico" class="btn-secundario" type="button">Histórico</button>
</header>

<main id="app">

  <section class="cabecalho-form card">
    <h2>Identificação</h2>
    <div class="grid-campos" id="campos-cabecalho"></div>
  </section>

  <div id="secoes-container"></div>

  <div class="barra-progresso-wrap">
    <div class="barra-progresso"><div id="barra-progresso-fill" class="fill"></div></div>
    <span id="progresso-texto">0 / 0 itens respondidos</span>
  </div>

</main>

<footer class="footer-fixo">
  <div id="mensagem-status" class="mensagem-status"></div>
  <button id="btn-gerar" class="btn-primario" type="button" disabled>Gerar PDF e Salvar</button>
</footer>

<!-- Modal de histórico -->
<div id="modal-historico" class="modal escondido">
  <div class="modal-conteudo">
    <div class="modal-cabecalho">
      <h2>Checklists gerados</h2>
      <button id="fechar-historico" class="btn-secundario" type="button">Fechar</button>
    </div>
    <div id="lista-historico" class="lista-historico"></div>
  </div>
</div>

<script src="script.js"></script>

<!-- Registro do Service Worker para o PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registrado com sucesso:', registration.scope);
        })
        .catch(error => {
          console.log('Falha ao registrar o Service Worker:', error);
        });
    });
  }
</script>
</body>
</html>
